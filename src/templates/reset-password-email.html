<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Скидання пароля</title>
  </head>
  <body>
    <h2>Привіт, {{username}}!</h2>

    <p>Ми отримали запит на скидання пароля для твого облікового запису.</p>

    <p>Щоб створити новий пароль, натисни кнопку нижче:</p>

    <p>
      <a
        href="{{resetPasswordUrl}}"
        style="
          display: inline-block;
          padding: 12px 20px;
          background: #16a085;
          color: white;
          text-decoration: none;
          border-radius: 5px;
        "
      >
        Скинути пароль
      </a>
    </p>

    <p>Посилання дійсне протягом 15 хвилин.</p>

    <p>Якщо ти не надсилала цей запит, просто проігноруй лист.</p>
  </body>
</html>
